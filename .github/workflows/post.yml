name: ShatterStop video bot
on:
  schedule:
    # backup only: restarts the self running loop if it ever stops
    - cron: "41 */2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render only, do not post"
        default: "false"
permissions:
  contents: write
  actions: write
concurrency:
  group: shatterstop-loop
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libcairo2 fontconfig
          mkdir -p ~/.fonts && (cp *.ttf fonts/*.ttf ~/.fonts/ 2>/dev/null || true)
          [ -f ~/.fonts/SpaceGrotesk.ttf ] || curl -sSL -o ~/.fonts/SpaceGrotesk.ttf "https://github.com/google/fonts/raw/main/ofl/spacegrotesk/SpaceGrotesk%5Bwght%5D.ttf"
          fc-cache -f && (fc-list | grep -i grotesk || echo "font missing, using fallback")
          pip install -q -r requirements.txt
      - name: Dry run
        if: github.event.inputs.dry_run == 'true'
        run: python videobot.py --dry-run
      - name: Posting loop
        if: github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL || vars.MAKE_WEBHOOK_URL }}
        run: bash run_loop.sh
